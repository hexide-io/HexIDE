<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="hexGrad" cx="38%" cy="35%" r="65%" fx="38%" fy="35%">
      <stop offset="0%"   stop-color="#FFB347"/>
      <stop offset="45%"  stop-color="#F07820"/>
      <stop offset="100%" stop-color="#C04A00"/>
    </radialGradient>
    <radialGradient id="hexShade" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <path d="
    M 171.0 59.0
    L 112.0 18.0
    Q 100.0 13.0 88.0 18.0
    L 29.0 59.0
    L 29.0 141.0
    L 88.0 182.0
    Q 100.0 187.0 112.0 182.0
    L 171.0 141.0
    Z
  " fill="url(#hexGrad)"/>

  <path d="
    M 171.0 59.0
    L 112.0 18.0
    Q 100.0 13.0 88.0 18.0
    L 29.0 59.0
    L 29.0 141.0
    L 88.0 182.0
    Q 100.0 187.0 112.0 182.0
    L 171.0 141.0
    Z
  " fill="url(#hexShade)"/>

  <!--
    Inner radius reduced from 18 to 12 (bonds closer to centre, implicit hex smaller/tighter)
    Outer radius unchanged at 60
    Atom circles up from r=10.8 to r=12.5
    Bond stroke-width unchanged at 11

    Inner coords at r=12 (was r=18):
      30°:  (100+12*cos30, 100-12*sin30) = (110.4, 94.0)
      90°:  (100, 100-12)                = (100.0, 88.0)
     150°:  (100-12*cos30, 100-12*sin30) = (89.6,  94.0)
     210°:  (89.6, 106.0)
     270°:  (100.0, 112.0)
     330°:  (110.4, 106.0)
  -->
  <g fill="white" stroke="white" stroke-linecap="butt">
    <!-- 30° -->
    <line x1="110.4" y1="94.0"  x2="151.96" y2="70.0"  stroke-width="11"/>
    <circle cx="151.96" cy="70.0"  r="12.5"/>
    <!-- 90° -->
    <line x1="100.0" y1="88.0"  x2="100.0"  y2="40.0"  stroke-width="11"/>
    <circle cx="100.0"  cy="40.0"  r="12.5"/>
    <!-- 150° -->
    <line x1="89.6"  y1="94.0"  x2="48.04"  y2="70.0"  stroke-width="11"/>
    <circle cx="48.04"  cy="70.0"  r="12.5"/>
    <!-- 210° -->
    <line x1="89.6"  y1="106.0" x2="48.04"  y2="130.0" stroke-width="11"/>
    <circle cx="48.04"  cy="130.0" r="12.5"/>
    <!-- 270° -->
    <line x1="100.0" y1="112.0" x2="100.0"  y2="160.0" stroke-width="11"/>
    <circle cx="100.0"  cy="160.0" r="12.5"/>
    <!-- 330° -->
    <line x1="110.4" y1="106.0" x2="151.96" y2="130.0" stroke-width="11"/>
    <circle cx="151.96" cy="130.0" r="12.5"/>
  </g>

</svg>
