name: Publish Release

# Manual-only. This prevents an accidental tag push from shipping a build before the pre-release
# pre-flight is done. Re-enable a tag trigger once the release process is settled.
#
# ── Why every publish here is RID-SPECIFIC ────────────────────────────────────────────────────────
# A RID-agnostic `dotnet publish` keeps runtimes/** for every RID SkiaSharp ships. Measured on the
# current shape: 277.5 MB on disk / 111.7 MB zipped, of which ~230 MB is native payload for platforms
# nobody targets — the "Windows" zip contained riscv64 Linux binaries. RID-specific is 47.5 MB / 17.4 MB.
#
# ── Two flavours per platform ─────────────────────────────────────────────────────────────────────
#   framework-dependent  ~26-32 MB archived — the IDE needs the .NET 11 Runtime installed
#   self-contained       ~90-102 MB archived — includes .NET; native libraries still required
# Measured from the v0.1.0 assets across all six RIDs. Both now carry the same self-contained single-file
# standalone runner (~105 MB unpacked on win-x64, measured 2026-10-26), so the framework-dependent figure is
# out of date and larger than this until it is measured again on a release (#1971). See the note above that step.
# Both are kept deliberately: self-contained means WE own runtime CVE patching, framework-dependent
# users get fixes from Microsoft Update.
#
# ── What is deliberately NOT enabled ──────────────────────────────────────────────────────────────
# PublishTrimmed: the add-in system loads signed packages at runtime via
# AssemblyLoadContext.LoadFromAssemblyPath, which is Microsoft's own documented counter-example for
# trimming; BuiltInComInteropSupport=true is a second documented incompatibility. AOT is out for the
# same reason (IsAotCompatible=false in HexIDE.Desktop.csproj), and separately for HexIDE.Standalone,
# where ILCompiler crashes on a LanguageExt generic instantiation — see the note above that step.
# PublishSingleFile for the IDE: it would swallow the LSP server's apphost. The standalone runner IS single-file,
# with IncludeNativeLibrariesForSelfExtract, set in its own project file (#1971). This note used to call that
# setting documented as incompatible with macOS ("Failed to create CoreCLR"). Microsoft's single-file page says no
# such thing as of its 2026-10-15 revision, and a runner built that way has not yet been started on macOS, so the
# mac legs' made programs are unverified rather than known broken.
#
# ── Signing ───────────────────────────────────────────────────────────────────────────────────────
# macOS bundles are sealed ad hoc, without a signing identity or notarisation.
# Downloaded builds can carry quarantine, including through tar (#4507), so macOS
# says it cannot verify HexIDE. See docs/macos-signing.md for notarisation prerequisites.
#
# First-party add-ins are signed by the sign-addins job, and only there (#4740). The key signs what HexIDE trusts as its
# own, and first-party is immune to revocation by identity, so a copy that leaks stays useful until the root changes.
# Every restore, build and publish runs the build-time code of each package it pulls in: source generators, analyzers,
# MSBuild targets. So no job that does one holds the key. The packer and addins jobs build what signing needs, with no
# key. sign-addins only runs the packer it is handed, inside the addin-signing environment that holds the secret, and
# the build legs then copy the signed packages into both flavours.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: true
      # Default OFF, and not because this is stable software. hexide.io links every download through
      # /releases/latest/download/<asset>, and GitHub's "latest" skips pre-releases. A release marked
      # pre-release therefore publishes perfectly and the site goes on serving the one before it, with
      # nothing anywhere reporting that. v0.1.0 went out as a full release; the "Alpha" in the body
      # below is what carries the stability warning.
      prerelease:
        description: 'Mark as a pre-release (hexide.io will NOT serve it - its links follow releases/latest)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Ten seconds, and it catches the mistake that otherwise ships silently: tagging v0.2.0 while
  # Directory.Build.props still says 0.1.0, so every binary reports a version nobody can find.
  # It also refuses a tag whose release is already published, before any job builds (#5424).
  preflight:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oP '(?<=<Version>)[^<]+' IDE/Directory.Build.props | head -1)
          tag='${{ inputs.tag }}'
          echo "Directory.Build.props <Version> = $version"
          echo "requested tag              = $tag"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag '$tag' does not match <Version> '$version'. Bump Directory.Build.props, or tag v$version."
            exit 1
          fi

      # Running again for a published release would replace its downloads with a build of this commit under the old tag
      # (#5424). A draft can be re-run as often as needed until it is published. Every other job needs this one, so a
      # refusal here comes before anything is built, signed or uploaded.
      - name: Refuse a tag whose release is already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/check-release-unpublished.sh "$TAG"

  # The revocation list hexide.io serves must verify against the root this release trusts. If it doesn't, every copy
  # ignores it and revocation does nothing, which went unnoticed until #4534. The check needs no key.
  revocations:
    name: Check hexide.io's revocation list
    needs: preflight
    runs-on: ubuntu-latest
    # It only reads the repository and fetches a public URL; the workflow's contents: write is for the release job.
    permissions:
      contents: read
    env:
      # 1 fails the release when the published list doesn't verify. 0 only warns: it was 0 until #4534 re-signed the
      # list with the root key, since a failing step would have blocked every release.
      REVOCATIONS_MUST_VERIFY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Verify the published list against the shipped root
        shell: bash
        run: |
          set -uo pipefail
          url=$(grep -oP '(?<=RevocationListUrl = ")[^"]+' IDE/HexIDE.Core/IDE/SettingsDefaults.cs)
          root=IDE/HexIDE/Addins/Trust/hexide-root.pub
          dir=$(mktemp -d)
          if [ -z "$url" ]; then
            problem="couldn't read RevocationListUrl from SettingsDefaults.cs"
          elif ! curl -fsSL --retry 3 -o "$dir/revocations.json" "$url" \
              || ! curl -fsSL --retry 3 -o "$dir/revocations.sig" "$url.sig"; then
            problem="couldn't fetch $url and its .sig"
          elif ! dotnet run --project IDE/HexIDE.AddinPacker -f net11.0 -c Release -- verify-revocations \
              --json "$dir/revocations.json" --sig "$dir/revocations.sig" --root "$root"; then
            problem="$url doesn't verify against $root, so every copy of this release ignores it and revokes nothing"
          else
            echo "$url verifies against $root"
            exit 0
          fi
          if [ "$REVOCATIONS_MUST_VERIFY" = 1 ]; then
            echo "::error::$problem"
            exit 1
          fi
          echo "::warning::$problem (only a warning: REVOCATIONS_MUST_VERIFY is 0)"

  # The packer, built alone. This binary runs beside the key, so the build-time code that produces it is as trusted as
  # the key itself. Keeping it apart from everything else keeps that to the SDK and the one analyzer package HexIDE.Core
  # references, with no Avalonia. Self-contained, so sign-addins installs no .NET.
  packer:
    name: Build the add-in packer
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Publish the packer (linux-x64, self-contained, single file)
        run: >-
          dotnet publish IDE/HexIDE.AddinPacker -f net11.0 -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          -o "$RUNNER_TEMP/addin-packer"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: addin-packer
          path: ${{ runner.temp }}/addin-packer/
          if-no-files-found: error
          retention-days: 1

  # The first-party add-ins, built unsigned and apart from the packer: AI Chat's closure takes in Avalonia. The packer
  # hashes and copies what this job builds, and runs none of it.
  addins:
    name: Build the first-party add-ins
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      # As the Desktop publish used to build it for packing: Release, with no runtime identifier, stamped with the commit.
      - name: Build AI Chat
        shell: bash
        run: dotnet build IDE/HexIDE.AIChat -f net11.0 -c Release -p:SourceRevisionId="$(git rev-parse --short HEAD)"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: addins-unsigned
          path: IDE/HexIDE.AIChat/bin/Release/net11.0/
          if-no-files-found: error
          retention-days: 1

  # The only job that holds the key, and it restores, builds and publishes nothing, so no package's build-time code runs
  # here. Its inputs: the public trust records and pack.args from this run's own commit; the packer and the unsigned
  # add-in, fetched by the ids their jobs reported, since an artifact replaced under the same name gets a new id; and the
  # key, from the addin-signing environment. Its actions are pinned by commit.
  sign-addins:
    name: Sign the first-party add-ins
    needs: [packer, addins]
    runs-on: ubuntu-latest
    environment: addin-signing
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PACKER_ARTIFACT: ${{ needs.packer.outputs.artifact-id }}
      ADDINS_ARTIFACT: ${{ needs.addins.outputs.artifact-id }}
    steps:
      # Given no id, download-artifact fetches every artifact of the run.
      - name: Check both artifact ids arrived
        run: |
          if [ -z "$PACKER_ARTIFACT" ] || [ -z "$ADDINS_ARTIFACT" ]; then
            echo "::error::the packer or addins job reported no artifact id"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /IDE/HexIDE.AddinPacker/firstparty/
            /IDE/HexIDE.AIChat/pack.args
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.packer.outputs.artifact-id }}
          path: ${{ runner.temp }}/addin-packer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.addins.outputs.artifact-id }}
          path: ${{ runner.temp }}/addins-unsigned
      - name: Sign AI Chat
        id: sign
        shell: bash
        env:
          HEXIDE_FIRSTPARTY_KEY: ${{ secrets.HEXIDE_FIRSTPARTY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HEXIDE_FIRSTPARTY_KEY" ]; then
            # A release from this repository without AI Chat would be a mistake, such as a secret set under another
            # name. A fork may have no key, and its release goes out without first-party add-ins, as before.
            if [ "$GITHUB_REPOSITORY" = hexide-io/HexIDE ]; then
              echo "::error::the addin-signing environment has no HEXIDE_FIRSTPARTY_KEY, so this release would ship without its first-party add-ins"
              exit 1
            fi
            echo "::warning::no HEXIDE_FIRSTPARTY_KEY: this release will omit first-party add-ins"
            exit 0
          fi
          umask 077
          trust="$RUNNER_TEMP/addin-trust"
          mkdir "$trust"
          cp IDE/HexIDE.AddinPacker/firstparty/{intermediate,publisher}.{json,sig} "$trust/"
          printf '%s' "$HEXIDE_FIRSTPARTY_KEY" > "$trust/firstparty.key"
          # One argument per line, read as HexIDE.Desktop.csproj reads them. The paths go first, and the packer takes
          # the first value of a repeated option.
          args=()
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            if [ -n "$line" ]; then args+=("$line"); fi
          done < IDE/HexIDE.AIChat/pack.args
          packer="$RUNNER_TEMP/addin-packer/HexIDE.AddinPacker"
          chmod +x "$packer"   # an artifact doesn't keep the execute bit
          "$packer" pack --src "$RUNNER_TEMP/addins-unsigned" --out "$RUNNER_TEMP/addins-signed/com.hexide.aichat" \
            --trust "$trust" "${args[@]}"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Delete the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/addin-trust"
      - id: upload
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addins-signed
          path: ${{ runner.temp }}/addins-signed/
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: [preflight, sign-addins]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: IDE
    strategy:
      # One broken architecture must not sink the whole release.
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, runner: windows-latest,  rid: win-x64,    os: win }
          - { name: windows-arm64, runner: windows-11-arm,  rid: win-arm64,  os: win }
          - { name: linux-amd64,   runner: ubuntu-latest,   rid: linux-x64,  os: linux }
          - { name: linux-arm,     runner: ubuntu-latest,   rid: linux-arm,  os: linux }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm, rid: linux-arm64, os: linux }
          - { name: macos-arm64,   runner: macos-latest,    rid: osx-arm64,  os: mac }
          # Last x86_64 macOS image on GitHub Actions, retiring Fall 2027 alongside Rosetta 2.
          # Intel Macs cannot run the arm64 build — Rosetta never translates arm64 to x64.
          - { name: macos-amd64,   runner: macos-15-intel,  rid: osx-x64,    os: mac }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # The standalone VB6 runner backs the IDE's "Make EXE" feature, so it ships inside BOTH packages.
      #
      # A made program IS this runner, renamed, beside its project archive, and Make copies that one
      # file (#1971). So the runner is one self-contained single-file executable, with .NET and the
      # native libraries inside it, and the same file goes into both packages: a made program has to run
      # on a machine with no .NET and no HexIDE, whichever package made it. HexIDE.Standalone.csproj
      # sets that for every publish, so nothing here passes --self-contained.
      #
      # It was PublishAot, one native file, until ILCompiler crashed on a LanguageExt generic
      # instantiation reached through HexIDE.Runtime (CodeGenerationFailedException ->
      # IndexOutOfRangeException in LazyGenericsSupport), a compiler bug rather than a missing
      # toolchain. Two per-flavour multi-file publishes replaced it (#30), and Make, which copies one
      # file, then made programs that could not start: v0.2.0's do not (#1971). The cost of the fix is
      # size: the framework-dependent package now carries a runtime inside its runner.
      # The SDK appends this to InformationalVersion as "+<sha>", so a build reports 0.1.0+4d9d4ba.
      # Resolved once here rather than inline, because the publish steps run under pwsh on the Windows
      # legs and bash elsewhere — an Actions-level expression is shell-agnostic.
      - name: Resolve build stamp
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The staging loop below copies bin/standalone into each flavour's standalone/.
      - name: Publish HexIDE.Standalone (${{ matrix.rid }}, single-file, self-contained)
        run: dotnet publish HexIDE.Standalone -f net11.0 -c Release -r ${{ matrix.rid }} -p:SourceRevisionId=${{ env.SHORT_SHA }} -o bin/standalone/

      - name: Publish HexIDE.Desktop (framework-dependent)
        run: dotnet publish HexIDE.Desktop -f net11.0 -c Release -r ${{ matrix.rid }} --self-contained false -p:SourceRevisionId=${{ env.SHORT_SHA }} -o bin/fdd/

      - name: Publish HexIDE.Desktop (self-contained)
        run: dotnet publish HexIDE.Desktop -f net11.0 -c Release -r ${{ matrix.rid }} --self-contained true -p:SourceRevisionId=${{ env.SHORT_SHA }} -o bin/sc/

      # Signed by sign-addins, the only job that holds the key. Where the Desktop publish used to pack them, before
      # staging, so the macOS seal and the Windows installer take them in as before.
      - name: Fetch the signed first-party add-ins
        if: needs.sign-addins.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.sign-addins.outputs.artifact-id }}
          path: IDE/bin/addins-signed

      - name: Add the signed first-party add-ins to both flavours
        shell: bash
        run: |
          set -euo pipefail
          for flavour in fdd sc; do
            # Nothing in this job holds the key, so neither publish above packs an add-in. A folder here means one did.
            if [ -e "bin/$flavour/addins" ]; then
              echo "::error::bin/$flavour/addins existed before the signed add-ins were added, so this job packed one (#4740)"
              exit 1
            fi
            if [ -d bin/addins-signed ]; then
              mkdir "bin/$flavour/addins"
              cp -R bin/addins-signed/. "bin/$flavour/addins/"
            fi
          done

      - name: Stage both flavours
        shell: bash
        run: |
          set -euo pipefail
          for flavour in fdd sc; do
            cp -R "bin/standalone" "bin/$flavour/standalone"
            find "bin/$flavour" -name '*.pdb' -type f -delete
            find "bin/$flavour" -name '*.dSYM' -type d -exec rm -rf {} + 2>/dev/null || true

            if [ "${{ matrix.os }}" = "win" ]; then
              mv "bin/$flavour/HexIDE.Desktop.exe" "bin/$flavour/HexIDE.exe"
            else
              # The execute bit matters for more than convenience: StdioProcessLspTransport prefers the
              # LSP apphost when it is executable and only falls back to `dotnet <dll>` when it is not.
              # A self-contained bundle has no `dotnet` on PATH, so without this chmod the fallback path
              # would silently disable every LSP diagnostic.
              chmod +x "bin/$flavour/HexIDE.Desktop" \
                       "bin/$flavour/standalone/HexIDE.Standalone" \
                       "bin/$flavour/HexIDE.VbLspServer" 2>/dev/null || true
              mv "bin/$flavour/HexIDE.Desktop" "bin/$flavour/HexIDE"
            fi
            echo "staged $flavour: $(du -sh "bin/$flavour" | cut -f1)"
          done

      # Without a bundle, double-clicking a bare Unix executable in Finder opens a Terminal window
      # instead of launching the app. The bundle is free and is required even when unsigned.
      - name: Build macOS .app bundles
        if: matrix.os == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          VERSION="${TAG#v}"
          for flavour in fdd sc; do
            # Sign and check apphosts before bundle assembly: codesign resolves the main
            # executable's bundled path to the bundle itself.
            SRC="bin/$flavour"

            # codesign decides what counts as a "code object" partly from the execute bit, so any
            # file carrying +x is expected to bear a signature -- including data. dotnet publish
            # hands back .json, .dll and friends with the bit set. Strip it from everything that is
            # not Mach-O; genuine entry points are Mach-O and keep theirs.
            find "$SRC" -type f -perm +111 -print0 |
              while IFS= read -r -d '' f; do
                file -b "$f" | grep -q '^Mach-O' || chmod -x "$f" || true
              done

            # Renaming HexIDE.Desktop -> HexIDE invalidates the linker's ad-hoc signature, and an
            # arm64 Mach-O with a broken or absent signature is killed outright (SIGKILL) on Apple
            # Silicon regardless of quarantine. Managed assemblies are signed too: a .dll is a PE
            # file, not Mach-O, so the Mach-O test alone would skip them.
            find "$SRC" -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' -o -perm +111 \) -print0 |
              while IFS= read -r -d '' f; do
                if [ "${f##*.}" = dll ] || file -b "$f" | grep -q '^Mach-O'; then
                  codesign --force --timestamp=none --sign - "$f" >/dev/null 2>&1 || true
                fi
              done

            # Keep the per-Mach-O gate as well as the bundle script's strict seal check.
            unsigned=0
            while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q '^Mach-O'; then
                codesign --verify "$f" 2>/dev/null || { echo "UNSIGNED: ${f#"$SRC"/}"; unsigned=1; }
              fi
            done < <(find "$SRC" -type f -perm +111 -print0)
            if [ "$unsigned" != 0 ]; then
              echo "One or more Mach-O binaries are unsigned; Apple Silicon will refuse to run them."
              exit 1
            fi
            echo "signed: every Mach-O in $flavour verified"

            ../scripts/macos-bundle.sh "$SRC" "bin/$flavour-app/HexIDE.app" "$VERSION"
          done

      - name: Smoke-check the staged output
        shell: bash
        env:
          SIGNED_ADDINS: ${{ needs.sign-addins.outputs.artifact-id }}
        run: |
          set -euo pipefail
          fail=0
          for flavour in fdd sc; do
            d="bin/$flavour"
            for f in HexIDE.VbLspServer.dll standalone; do
              [ -e "$d/$f" ] || { echo "MISSING $d/$f"; fail=1; }
            done
            if [ -n "$SIGNED_ADDINS" ] && [ ! -e "$d/addins/com.hexide.aichat/addin.sig" ]; then
              echo "MISSING $d/addins/com.hexide.aichat/addin.sig"
              fail=1
            fi
            if [ "${{ matrix.os }}" != "win" ]; then
              # Guards the regression class this pipeline exists to close.
              [ -x "$d/HexIDE.VbLspServer" ] || { echo "NOT EXECUTABLE: $d/HexIDE.VbLspServer"; fail=1; }
              [ -x "$d/HexIDE" ] || { echo "NOT EXECUTABLE: $d/HexIDE"; fail=1; }
            fi
            # A RID-specific publish flattens natives to the root; runtimes/ reappearing means the RID
            # was dropped somewhere and the artifact is about to be six times too big.
            # Written as an if rather than `[ -d x ] && {...}`: under set -e the exit status of a
            # false test at the end of a loop body is not portably safe.
            # Checked for the standalone runner too, not just the root: it is a separate publish, and a
            # dropped RID would resurface there.
            for sub in "" "/standalone"; do
              if [ -d "$d$sub/runtimes" ]; then
                echo "UNEXPECTED $d$sub/runtimes — publish went RID-agnostic"
                fail=1
              fi
            done
            # Make copies the runner alone, so a runner that needs anything beside it makes programs that
            # cannot start, which is what v0.2.0 shipped (#1971). Its managed assembly beside it means the
            # publish went multi-file.
            if [ -e "$d/standalone/HexIDE.Standalone.dll" ]; then
              echo "UNEXPECTED $d/standalone/HexIDE.Standalone.dll — the runner is not single-file"
              fail=1
            fi
          done
          exit $fail

      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          # SHA-256 and size: digest GitHub records for the asset the publisher uploaded to
          # jrsoftware/issrc release is-6_7_3 (read 2026-10-25 with
          # gh api repos/jrsoftware/issrc/releases/tags/is-6_7_3). Publisher-hosted, not computed here.
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-Item $installer).Length -ne 10592232) { throw 'Inno Setup installer size mismatch' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Inno Setup installer SHA-256 mismatch' }
          # jrsoftware.org/isdl-verify.php names Pyrsys B.V. for 6.4.2 and later.
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Pyrsys B\.V\.(?:,|$)') {
            throw 'Inno Setup installer Authenticode verification failed'
          }
          $setup = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed: $($setup.ExitCode)" }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # ISCC.exe carries no version resource (it reads 0.0.0.0), so ask the uninstall entry the installer writes.
          $installed = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1').DisplayVersion
          if ($installed -ne '6.7.3') { throw "Unexpected Inno Setup version installed: $installed" }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          & $compiler "/DAppVersion=$version" "/DPublishDir=$((Resolve-Path 'bin/sc').Path)" '../installer/HexIDE.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'win-x64'
        with:
          name: hexide-windows-installer
          path: ./IDE/bin/hexide-windows-amd64-setup.exe
          if-no-files-found: error

      - name: Archive (Windows)
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          Compress-Archive -Path './bin/fdd/*' -DestinationPath './bin/hexide-${{ matrix.name }}.zip'
          Compress-Archive -Path './bin/sc/*'  -DestinationPath './bin/hexide-${{ matrix.name }}-selfcontained.zip'

      - name: Archive (Linux)
        if: matrix.os == 'linux'
        run: |
          tar -czf ./bin/hexide-${{ matrix.name }}.tar.gz -C ./bin/fdd .
          tar -czf ./bin/hexide-${{ matrix.name }}-selfcontained.tar.gz -C ./bin/sc .

      # Quarantine can propagate through this archive too (#4507).
      - name: Archive (macOS)
        if: matrix.os == 'mac'
        run: |
          tar -czf ./bin/hexide-${{ matrix.name }}.tar.gz -C ./bin/fdd-app HexIDE.app
          tar -czf ./bin/hexide-${{ matrix.name }}-selfcontained.tar.gz -C ./bin/sc-app HexIDE.app

      - uses: actions/upload-artifact@v7
        with:
          name: hexide-${{ matrix.name }}
          path: ./IDE/bin/hexide-${{ matrix.name }}*.*
          if-no-files-found: error

  # A single release job. Seven matrix legs each calling action-gh-release would race to create the same
  # release, and the loser can drop its assets.
  release:
    name: Publish release
    needs: [build, revocations]
    runs-on: ubuntu-latest
    steps:
      # Only the guard script, for the last step before the upload. It comes first because a checkout empties the
      # workspace, which would take the downloaded artifacts with it.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/check-release-unpublished.sh
          sparse-checkout-cone-mode: false

      # Only the release's own artifacts, which are all named hexide-*. Without a pattern this fetches every artifact of
      # the run, and the packer and the unsigned add-in would become release assets.
      - uses: actions/download-artifact@v8
        with:
          pattern: hexide-*
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      # Checked again: the draft may have been published while this run built, and the upload would then replace a
      # published release's downloads (#5424).
      - name: Refuse a release published while this run built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/check-release-unpublished.sh "$TAG"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          # The commit this run built and signed. Without it a draft records its target as the default branch, and the
          # tag is created at publish wherever that branch has moved to by then (#5409).
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}
          # The saving warning leads, and is not decoration. A release page is reached directly --
          # from search, from a link, from someone's chat message -- by people who never see the
          # site. Without it here, the first thing they read is "nothing is signed", which sounds
          # like an inconvenience rather than something that can cost them a project. Keep it
          # worded the same as the site banner so the two cannot drift.
          body: |
            An open, cross-platform recreation of the Visual Basic 6 IDE. **Alpha.**

            > ⚠️ HexIDE opens and runs real VB6 projects, and a save now gives back the file it read:
            > **all 22 designer files VB6 itself ships survive a save byte for byte**, and a form HexIDE
            > cannot give back opens read-only rather than being quietly rewritten. Keep a backup anyway:
            > that measure is Microsoft's own templates, not your project.
            > [What a save changes](https://hexide.io/scope.html#saving)

            **What's new:** [CHANGELOG.md](https://github.com/hexide-io/HexIDE/blob/${{ inputs.tag }}/CHANGELOG.md)

            **Which download?**
            - **Windows x64:** `hexide-windows-amd64-setup.exe` — installs for all users; includes .NET.
            - `hexide-<platform>-selfcontained.*` — portable archive; includes .NET.
            - `hexide-<platform>.*` — smaller, but needs the [.NET 11 Runtime](https://dotnet.microsoft.com/download/dotnet/11.0) installed.

            [Download and run instructions](https://github.com/hexide-io/HexIDE/blob/${{ inputs.tag }}/README.md#download-and-run), including Linux extraction and launch steps.

            No build has a signing identity or is notarised.
            **Windows** shows a SmartScreen warning: More info → Run anyway.
            **macOS** says it can't verify HexIDE the first time, because the build isn't notarised: choose Done, then System Settings → Privacy & Security → Open Anyway, and confirm with an administrator's password.
            **Linux** self-contained still needs native libraries, including the distro's `libX11`, `libICE`, `libSM`, `fontconfig` and ICU. Native Wayland (`auto` or `wayland`) also needs `libwayland-client`, `libwayland-cursor` and `libxkbcommon`, plus `libEGL` and `libwayland-egl` for GPU rendering.
