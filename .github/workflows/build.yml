name: Build VB6

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # ── May the build jobs be skipped for this pull request? ──────────────────────────────────────────
  # A docs-only change cannot break a build, and being told so costs 6m 40s of build-ide. That is paid
  # on every merge and then paid AGAIN after every "Update branch", because protect-main requires the
  # branch be up to date. The guards below are the floor and they cost about ten seconds between them.
  #
  # This job fails CLOSED, which is the whole of its design:
  #   * it publishes `skip`, never `code`. Every consumer tests `skip != 'true'`, so an absent output —
  #     this job erroring, a mistyped pattern, a later edit that forgets to set it — BUILDS.
  #   * the list below enumerates what is safe to skip, not what is code. A path nobody has thought
  #     about yet, including a whole new top-level directory, is code by default.
  # Inverted, the failure mode is a green tick on a tree nothing compiled — the same false green the
  # hygiene guard's self-test exists to catch, and it would be invisible here for the same reason.
  #
  # Pull requests only. A push to main is nobody's critical path, and reading github.event.before
  # brings force-push and first-push edge cases for no gain. When this job does not run its outputs
  # are empty, so the builds run: the fail-closed path again, not a special case.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    env:
      # Markdown under docs/ that the build genuinely reads. These are code, not prose. Checked
      # against the tree by the next step rather than trusted, because a hand-kept list is the part
      # that rots — and this one rots silently, into builds that were skipped and should not have been.
      DOC_BUILD_INPUTS: |
        docs/ROADMAP.md
        docs/command-line.md
        docs/lsp-client.md
        docs/lsp-server-features.md
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The decision is a diff, and a shallow clone has no base commit to diff against.
          fetch-depth: 0

      - name: Check the build-input list still matches the tree
        run: |
          set -euo pipefail
          declared=$(printf '%s\n' "$DOC_BUILD_INPUTS" | tr -d ' \r' | sed '/^$/d' | sort -u)
          # A test reading a doc at runtime: Path.Combine(<root>, "docs", "<name>.md"). The leading
          # comma is load-bearing — it requires "docs" to be resolved against something rather than
          # being the first argument, which is what separates a real read from a relative path used
          # as a fixture (RelatedDocumentSerializationTests builds Path.Combine("docs", "README.md")
          # to test slash conversion and never opens it). This is a net, not a proof: a doc read
          # through some other shape would slip past, so widen it when one appears.
          from_tests=$(grep -rhoE ',[[:space:]]*"docs",[[:space:]]*"[^"]+\.md"' --include='*.cs' IDE LspServer 2>/dev/null \
                       | sed -E 's|.*"([^"]+\.md)"|docs/\1|' || true)
          # A doc listed in the solution, which a build resolves.
          from_slnx=$(grep -oE 'docs/[^"]+\.md' HexIDE.slnx 2>/dev/null || true)
          actual=$(printf '%s\n%s\n' "$from_tests" "$from_slnx" | sed '/^$/d' | sort -u)

          missing=$(comm -13 <(printf '%s\n' "$declared") <(printf '%s\n' "$actual"))
          if [ -n "$missing" ]; then
            echo "::error::The build reads these docs, but DOC_BUILD_INPUTS does not list them."
            echo "::error::Editing one would skip the build that checks it. Add them, or stop reading them."
            printf '%s\n' "$missing" | sed 's/^/  /'
            exit 1
          fi
          echo "Build-input list agrees with the tree:"
          printf '%s\n' "$actual" | sed 's/^/  /'

      - name: Decide whether the builds can be skipped
        id: decide
        run: |
          set -euo pipefail
          # HEAD is the pull request's merge commit, so HEAD^1 is the base branch tip it was merged
          # onto and this diff is the pull request's own changes against main AS IT STANDS NOW.
          # Diffing the recorded base SHA instead would re-attribute everything that landed since —
          # which is exactly the "Update branch" case this job exists to make cheap.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          skip=true
          if [ -z "$files" ]; then skip=false; fi
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            if printf '%s\n' "$DOC_BUILD_INPUTS" | tr -d ' \r' | grep -qxF "$f"; then
              echo "  code: $f is a build input"; skip=false; continue
            fi
            case "$f" in
              docs/*.md|docs/*/*.md)                     ;;
              docs/*.png|docs/*/*.png|docs/*.svg)        ;;
              screenshots/*|screenshots/*/*)             ;;
              .github/ISSUE_TEMPLATE/*)                  ;;
              LICENSE)                                   ;;
              */*)     echo "  code: $f"; skip=false     ;;
              *.md)                                      ;;
              *)       echo "  code: $f"; skip=false     ;;
            esac
          done <<< "$files"

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Skip build-ide and build-lsp-server: $skip"

  build-ide:
    needs: changes
    # Runs unless `changes` affirmatively said skip. A status-check function is required
    # here: without one, a skipped or failed `needs` would skip this job no matter what the
    # rest of the expression says — and a skipped job reports Success to a required check.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IDE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Node is needed by ONE of the foreign servers — the reference implementation, which is a package
      # rather than a binary. Declared rather than assumed: the runner image happens to ship Node, and a
      # dependency that works by luck is one that breaks on an image change for reasons nobody can see.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The foreign-server tests drive real third-party language servers, and are the only check that
      # HexIDE speaks LSP to something it did not write — a client and server by one hand agree with each
      # other rather than with the specification. They are fetched on demand rather than committed, each
      # pinned: the self-contained ones by a SHA-256 per asset, the Node one by an npm lockfile that
      # carries a registry-attested hash for every package in its tree. Cached, so the usual run does not
      # go to the network at all. See docs/foreign-language-servers.md.
      - name: Cache the foreign language servers
        uses: actions/cache@v4
        with:
          path: artifacts/foreign-lsp
          # The lockfile is part of the key: it pins the Node server's whole dependency tree, so a change
          # there must invalidate the cache exactly as a version bump in the acquisition file does.
          key: >-
            foreign-lsp-${{ runner.os }}-${{ hashFiles(
              'IDE/HexIDE.Tests/LspClient/ForeignServerAcquisition.cs',
              'tools/node-lsp/package-lock.json') }}

      # The protocol's own model of itself, which the coverage table in docs/lsp-client.md is checked
      # against. Pinned to a commit, so the key needs nothing but the file that names it. Platform-neutral
      # — it is a JSON document, not a binary — but keyed by OS anyway to match its neighbour rather than
      # invent a second convention.
      - name: Cache the LSP specification model
        uses: actions/cache@v4
        with:
          path: artifacts/lsp-metamodel
          key: >-
            lsp-metamodel-${{ runner.os }}-${{ hashFiles(
              'IDE/HexIDE.Tests/LspClient/LspSpecificationModel.cs') }}

      - name: Run Runtime Tests
        run: dotnet test HexIDE.Runtime.Tests/HexIDE.Runtime.Tests.csproj

      # The IDE half and the server half are separate builds, and nothing in this job produced the server
      # until now. One test needs it: the only one where HexIDE's own client speaks to HexIDE's own
      # server over a real process, rather than each half being proved against a fixture spoken by hand.
      # Without this step it skips, and HEXIDE_REQUIRE_FOREIGN_LSP below turns that skip into a failure.
      - name: Build the bundled VB6 language server (for the round-trip test)
        working-directory: LspServer
        run: dotnet build HexIDE.VbLspServer/HexIDE.VbLspServer.csproj

      # HEXIDE_REQUIRE_FOREIGN_LSP turns "no server available" from a skip into a failure. Without it a
      # broken download would quietly return the suite to the state this change exists to leave: green,
      # with the foreign-backend proof silently not running.
      - name: Run ViewModel Tests
        env:
          HEXIDE_REQUIRE_FOREIGN_LSP: '1'
        run: dotnet test HexIDE.Tests/HexIDE.Tests.csproj

      - name: Run Integration Tests (headless Avalonia UI)
        run: dotnet test HexIDE.Integration.Tests/HexIDE.Integration.Tests.csproj

      # First-party add-in signing: restore the publisher key from a repo secret so the (Exists-gated)
      # PackAIChatAddin target signs and bundles the add-ins. Forks/PRs receive no secret → the value is
      # empty → packing is skipped and the build still succeeds. The key never lives in the repo.
      - name: Restore first-party signing key (if configured)
        env:
          HEXIDE_FIRSTPARTY_KEY: ${{ secrets.HEXIDE_FIRSTPARTY_KEY }}
        run: |
          if [ -n "$HEXIDE_FIRSTPARTY_KEY" ]; then
            printf '%s' "$HEXIDE_FIRSTPARTY_KEY" > HexIDE.AddinPacker/firstparty/firstparty.key
            echo "first-party signing key restored — add-ins will be signed"
          else
            echo "no HEXIDE_FIRSTPARTY_KEY secret — add-ins unsigned (expected for forks/PRs)"
          fi

      # No -o: the first-party add-in packaging targets in HexIDE.Desktop.csproj pack each add-in from
      # its own per-project bin. 'dotnet build -o <dir>' forces every referenced project's output into a
      # single flattened dir, which both breaks those paths and would pack the whole IDE as the add-in.
      - name: Build HexIDE.Desktop (Linux)
        run: dotnet build HexIDE.Desktop -f net10.0

      - name: Build HexIDE.Standalone (Linux)
        run: dotnet build HexIDE.Standalone -f net10.0

      # The configuration nothing else here builds, and the one the protocol capture has to survive.
      # Release removes the automation server's whole Server/ folder and its AspNetCore framework
      # reference; the capture ships regardless, because its audience is somebody writing a language
      # server against a HexIDE they downloaded. A source guard asserts the arrangement
      # (CaptureShipsWithoutTheServerTests), and this asserts the arrangement still compiles — the two
      # fail in different ways and neither subsumes the other.
      - name: Build HexIDE.Desktop in Release (the configuration the server is absent from)
        run: dotnet build HexIDE.Desktop -f net10.0 -c Release

  build-lsp-server:
    needs: changes
    # Runs unless `changes` affirmatively said skip. A status-check function is required
    # here: without one, a skipped or failed `needs` would skip this job no matter what the
    # rest of the expression says — and a skipped job reports Success to a required check.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LspServer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run VB LSP Server Tests
        run: dotnet test HexIDE.VbLspServer.Tests/HexIDE.VbLspServer.Tests.csproj

      - name: Build VB LSP Server
        run: dotnet build HexIDE.VbLspServer/HexIDE.VbLspServer.csproj

  # Repo-wide guard: the tree must stay 100% MIT — no GPL-licensed artifacts may reappear.
  guard-mit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No existence guard. The script used to live only in the private repository, so this
      # step skipped here and reported success — the check has never actually run against
      # this tree. If it goes missing again, this must go red rather than quietly pass.
      - name: Guard the 100%-MIT tree (no GPL, no unknown-licence dependency)
        run: bash scripts/check-licences.sh

  # Repo-wide guard: the checks that used to run only when this tree was produced by a
  # copy-in from elsewhere. There is no copy-in any more, so they run here.
  guard-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Before the guard, not after: this asks whether the guard can still SEE an untracked
      # file. Three of its scans could not, while its header said they could (#437), and CI
      # was structurally unable to notice because everything is tracked once a runner has
      # checked out. A guard whose failure mode is a false green has to be handed something
      # bad and watched catching it.
      - name: Self-test the hygiene guard
        run: bash scripts/check-tree-hygiene.selftest.sh

      - name: Guard tree hygiene (keys, artefacts, links, paths, naming)
        env:
          # Supplied from a repository secret so the pattern itself is never committed —
          # writing it into the script would publish the string the check looks for. When
          # the secret is absent (a pull request from a fork cannot read secrets) the
          # script says the scan was skipped instead of reporting a pass it did not earn.
          HEXIDE_IDENTITY_PATTERN: ${{ secrets.HEXIDE_IDENTITY_PATTERN }}
        run: bash scripts/check-tree-hygiene.sh