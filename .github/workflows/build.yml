name: Build VB6

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-ide:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IDE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Node is needed by ONE of the foreign servers — the reference implementation, which is a package
      # rather than a binary. Declared rather than assumed: the runner image happens to ship Node, and a
      # dependency that works by luck is one that breaks on an image change for reasons nobody can see.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The foreign-server tests drive real third-party language servers, and are the only check that
      # HexIDE speaks LSP to something it did not write — a client and server by one hand agree with each
      # other rather than with the specification. They are fetched on demand rather than committed, each
      # pinned: the self-contained ones by a SHA-256 per asset, the Node one by an npm lockfile that
      # carries a registry-attested hash for every package in its tree. Cached, so the usual run does not
      # go to the network at all. See docs/foreign-language-servers.md.
      - name: Cache the foreign language servers
        uses: actions/cache@v4
        with:
          path: artifacts/foreign-lsp
          # The lockfile is part of the key: it pins the Node server's whole dependency tree, so a change
          # there must invalidate the cache exactly as a version bump in the acquisition file does.
          key: >-
            foreign-lsp-${{ runner.os }}-${{ hashFiles(
              'IDE/HexIDE.Tests/LspClient/ForeignServerAcquisition.cs',
              'tools/node-lsp/package-lock.json') }}

      # The protocol's own model of itself, which the coverage table in docs/lsp-client.md is checked
      # against. Pinned to a commit, so the key needs nothing but the file that names it. Platform-neutral
      # — it is a JSON document, not a binary — but keyed by OS anyway to match its neighbour rather than
      # invent a second convention.
      - name: Cache the LSP specification model
        uses: actions/cache@v4
        with:
          path: artifacts/lsp-metamodel
          key: >-
            lsp-metamodel-${{ runner.os }}-${{ hashFiles(
              'IDE/HexIDE.Tests/LspClient/LspSpecificationModel.cs') }}

      - name: Run Runtime Tests
        run: dotnet test HexIDE.Runtime.Tests/HexIDE.Runtime.Tests.csproj

      # HEXIDE_REQUIRE_FOREIGN_LSP turns "no server available" from a skip into a failure. Without it a
      # broken download would quietly return the suite to the state this change exists to leave: green,
      # with the foreign-backend proof silently not running.
      - name: Run ViewModel Tests
        env:
          HEXIDE_REQUIRE_FOREIGN_LSP: '1'
        run: dotnet test HexIDE.Tests/HexIDE.Tests.csproj

      - name: Run Integration Tests (headless Avalonia UI)
        run: dotnet test HexIDE.Integration.Tests/HexIDE.Integration.Tests.csproj

      # First-party add-in signing: restore the publisher key from a repo secret so the (Exists-gated)
      # PackAIChatAddin target signs and bundles the add-ins. Forks/PRs receive no secret → the value is
      # empty → packing is skipped and the build still succeeds. The key never lives in the repo.
      - name: Restore first-party signing key (if configured)
        env:
          HEXIDE_FIRSTPARTY_KEY: ${{ secrets.HEXIDE_FIRSTPARTY_KEY }}
        run: |
          if [ -n "$HEXIDE_FIRSTPARTY_KEY" ]; then
            printf '%s' "$HEXIDE_FIRSTPARTY_KEY" > HexIDE.AddinPacker/firstparty/firstparty.key
            echo "first-party signing key restored — add-ins will be signed"
          else
            echo "no HEXIDE_FIRSTPARTY_KEY secret — add-ins unsigned (expected for forks/PRs)"
          fi

      # No -o: the first-party add-in packaging targets in HexIDE.Desktop.csproj pack each add-in from
      # its own per-project bin. 'dotnet build -o <dir>' forces every referenced project's output into a
      # single flattened dir, which both breaks those paths and would pack the whole IDE as the add-in.
      - name: Build HexIDE.Desktop (Linux)
        run: dotnet build HexIDE.Desktop -f net10.0

      - name: Build HexIDE.Standalone (Linux)
        run: dotnet build HexIDE.Standalone -f net10.0

  build-lsp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LspServer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run VB LSP Server Tests
        run: dotnet test HexIDE.VbLspServer.Tests/HexIDE.VbLspServer.Tests.csproj

      - name: Build VB LSP Server
        run: dotnet build HexIDE.VbLspServer/HexIDE.VbLspServer.csproj

  # Repo-wide guard: the tree must stay 100% MIT — no GPL-licensed artifacts may reappear.
  guard-mit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No existence guard. The script used to live only in the private repository, so this
      # step skipped here and reported success — the check has never actually run against
      # this tree. If it goes missing again, this must go red rather than quietly pass.
      - name: Guard the 100%-MIT tree (no GPL, no unknown-licence dependency)
        run: bash scripts/check-licences.sh

  # Repo-wide guard: the checks that used to run only when this tree was produced by a
  # copy-in from elsewhere. There is no copy-in any more, so they run here.
  guard-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard tree hygiene (keys, artefacts, links, paths, naming)
        env:
          # Supplied from a repository secret so the pattern itself is never committed —
          # writing it into the script would publish the string the check looks for. When
          # the secret is absent (a pull request from a fork cannot read secrets) the
          # script says the scan was skipped instead of reporting a pass it did not earn.
          HEXIDE_IDENTITY_PATTERN: ${{ secrets.HEXIDE_IDENTITY_PATTERN }}
        run: bash scripts/check-tree-hygiene.sh